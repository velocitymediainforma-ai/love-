<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesan untukmu ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      background: radial-gradient(circle at top, #54204e 0%, #210d2b 48%, #100818 100%);
    }
    .glow {
      position: fixed; width: 320px; height: 320px; border-radius: 50%;
      background: #ff2d75; filter: blur(110px); opacity: .22; pointer-events: none;
    }
    .card {
      width: min(90vw, 520px);
      padding: 42px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 28px;
      background: rgba(255,255,255,.08);
      box-shadow: 0 20px 70px rgba(0,0,0,.25);
      backdrop-filter: blur(12px);
      z-index: 1;
    }
    .small { color: #ffd5e4; letter-spacing: .12em; font-size: .8rem; text-transform: uppercase; }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(2.6rem, 11vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: -.05em;
      opacity: 0;
      transform: translateY(18px) scale(.92);
    }
    h1.show { animation: reveal 1s cubic-bezier(.2,.8,.2,1) forwards; }
    .heart-main { display: inline-block; color: #ff4d86; animation: heartbeat 1s infinite; }
    p { color: #f7dce8; line-height: 1.6; min-height: 48px; }
    button {
      border: 0; border-radius: 999px; padding: 14px 24px; margin-top: 12px;
      color: #4b1431; background: linear-gradient(135deg, #ffd4e3, #ff6f9f);
      font-size: 1rem; font-weight: 750; cursor: pointer;
      box-shadow: 0 8px 24px rgba(255,77,134,.25);
      transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255,77,134,.4); }
    .hint { font-size: .85rem; color: #cdb6d2; margin-top: 20px; }
    .floating-heart {
      position: fixed; bottom: -40px; z-index: 0; pointer-events: none;
      animation: float-up linear forwards; opacity: .9;
    }
    @keyframes reveal {
      0% { opacity: 0; transform: translateY(18px) scale(.92); filter: blur(8px); }
      65% { opacity: 1; transform: translateY(-5px) scale(1.04); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      18% { transform: scale(1.22); }
      35% { transform: scale(1); }
      52% { transform: scale(1.14); }
    }
    @keyframes float-up {
      to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <main class="card">
    <div class="small">Ada sesuatu untukmu</div>
    <h1 id="message">I Love You <span class="heart-main">♥</span></h1>
    <p id="subtitle">Ada pesan kecil yang ingin kusampaikan...</p>
    <button id="revealButton">Klik di sini ❤️</button>
    <div class="hint">Senyum dulu, ya 😊</div>
  </main>
  <script>
    const button = document.getElementById("revealButton");
    const message = document.getElementById("message");
    const subtitle = document.getElementById("subtitle");
    let revealed = false;

    function makeHeart() {
      const heart = document.createElement("span");
      heart.className = "floating-heart";
      heart.textContent = ["♥", "♡", "💗", "💕"][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (16 + Math.random() * 28) + "px";
      heart.style.color = ["#ff6f9f", "#ffc2d8", "#fff0f5"][Math.floor(Math.random() * 3)];
      heart.style.animationDuration = (3 + Math.random() * 4) + "s";
      document.body.appendChild(heart);
      heart.addEventListener("animationend", () => heart.remove());
    }

    button.addEventListener("click", () => {
      if (!revealed) {
        message.classList.remove("show");
        void message.offsetWidth;
        message.classList.add("show");
        subtitle.textContent = "Aku cuma ingin kamu tahu... kamu spesial ❤️";
        button.textContent = "Klik lagi untuk hati 💕";
        revealed = true;
      }
      for (let i = 0; i < 18; i++) {
        setTimeout(makeHeart, i * 90);
      }
    });
  </script>
</body>
</html>
